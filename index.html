<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumble Guys 3D - Web Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .game-title {
            text-align: center;
            color: #fff;
            font-size: 3em;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .score-item {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 15px;
            color: #fff;
            font-size: 1.3em;
            font-weight: bold;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .score-value {
            color: #ffd700;
            font-size: 1.2em;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 1.1em;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .character-select {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            pointer-events: all;
        }

        .character-select.hidden {
            display: none;
        }

        .character-select h2 {
            font-size: 3em;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            max-width: 900px;
            pointer-events: all;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 4px solid transparent;
            text-align: center;
        }

        .character-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1) translateY(-5px);
            border-color: #667eea;
        }

        .character-card.selected {
            background: rgba(102, 126, 234, 0.5);
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }

        .character-icon {
            font-size: 3.5em;
            margin-bottom: 10px;
        }

        .character-name {
            font-size: 1em;
            font-weight: bold;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 50px;
            border-radius: 30px;
            display: none;
            z-index: 150;
            text-align: center;
            border: 5px solid #ff6b6b;
            pointer-events: all;
        }

        .game-over.active {
            display: block;
        }

        .game-over h2 {
            font-size: 4em;
            margin-bottom: 20px;
            color: #ff6b6b;
            text-shadow: 3px 3px 10px rgba(255, 107, 107, 0.5);
        }

        .game-over p {
            font-size: 1.8em;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 20px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            margin: 10px;
            font-weight: bold;
            pointer-events: all;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .current-character {
            position: fixed;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 40px;
            border-radius: 20px;
            color: #fff;
            font-size: 1.3em;
            border: 3px solid rgba(255, 215, 0, 0.5);
        }

        .current-character span {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="character-select" id="characterSelect">
        <h2>Choose Your 3D Character!</h2>
        <div class="character-grid" id="characterGrid"></div>
        <button onclick="startGame()">START GAME</button>
    </div>

    <div class="ui-overlay">
        <h1 class="game-title">🎮 RUMBLE GUYS 3D 🎮</h1>
        <div class="current-character">
            Playing as: <span id="currentCharacter">Human</span>
        </div>
        <div class="score-board">
            <div class="score-item">Score: <span class="score-value" id="score">0</span></div>
            <div class="score-item">High Score: <span class="score-value" id="highScore">0</span></div>
            <div class="score-item">Level: <span class="score-value" id="level">1</span></div>
        </div>
    </div>

    <div class="controls">
        ⬅️ A/D or ARROWS to Move | SPACE to Jump | C to Change Character
    </div>

    <div class="game-over" id="gameOver">
        <h2>GAME OVER!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>High Score: <span id="finalHighScore">0</span></p>
        <button onclick="restartGame()">PLAY AGAIN</button>
        <button onclick="showCharacterSelect()">CHANGE CHARACTER</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Check if Three.js loaded
        if (typeof THREE === 'undefined') {
            alert('Three.js failed to load! Please check your internet connection and refresh the page.');
            console.error('THREE is not defined - library failed to load');
        }

        // Character definitions
        const characters = [
            { id: 'human', name: 'Human', icon: '🧍', primaryColor: 0x4a90e2, secondaryColor: 0xffdbac },
            { id: 'tree', name: 'Tree', icon: '🌳', primaryColor: 0x228b22, secondaryColor: 0x8b4513 },
            { id: 'bird', name: 'Bird', icon: '🐦', primaryColor: 0xffcc00, secondaryColor: 0xff6600 },
            { id: 'chair', name: 'Chair', icon: '🪑', primaryColor: 0x8b4513, secondaryColor: 0x654321 },
            { id: 'bear', name: 'Bear', icon: '🐻', primaryColor: 0x8b4513, secondaryColor: 0xd2b48c },
            { id: 'plant', name: 'Plant', icon: '🌱', primaryColor: 0x22c55e, secondaryColor: 0xcd853f },
            { id: 'dog-sports', name: 'Sports Dog', icon: '🐕', primaryColor: 0xff6b6b, secondaryColor: 0xd2691e },
            { id: 'cat-sports', name: 'Sports Cat', icon: '🐈', primaryColor: 0xff8c42, secondaryColor: 0xffa07a },
            { id: 'basketball', name: 'Basketball', icon: '🏀', primaryColor: 0xff6600, secondaryColor: 0xff8800 },
            { id: 'king', name: 'King', icon: '🤴', primaryColor: 0x8b0000, secondaryColor: 0xffd700 },
            { id: 'queen', name: 'Queen', icon: '👸', primaryColor: 0xff69b4, secondaryColor: 0xffd700 },
            { id: 'penguin', name: 'Penguin', icon: '🐧', primaryColor: 0x000000, secondaryColor: 0xffffff },
            { id: 'rabbit', name: 'Rabbit', icon: '🐰', primaryColor: 0xd4a5a5, secondaryColor: 0xffb6c1 },
            { id: 'flower', name: 'Flower', icon: '🌺', primaryColor: 0xff1493, secondaryColor: 0xffff00 },
            { id: 'cactus', name: 'Cactus', icon: '🌵', primaryColor: 0x3d9970, secondaryColor: 0x2d7050 }
        ];

        let selectedCharacter = characters[0];
        let scene, camera, renderer, player;
        let obstacles = [];
        let coins = [];
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let level = 1;
        let gameSpeed = 0.05;
        let frameCount = 0;
        let playerVelocityY = 0;
        let isJumping = false;
        const gravity = -0.015;
        const jumpPower = 0.35;

        const keys = {};

        // Initialize Three.js scene
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 8);
            camera.lookAt(0, 1, 0);

            // Renderer
            const canvas = document.getElementById('gameCanvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add(directionalLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x2ecc71,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid pattern on ground
            const gridHelper = new THREE.GridHelper(100, 50, 0x27ae60, 0x27ae60);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Create 3D character
        function createCharacter(charType) {
            const group = new THREE.Group();

            switch(charType.id) {
                case 'human':
                    // Body
                    const bodyGeo = new THREE.BoxGeometry(0.6, 1, 0.4);
                    const bodyMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const body = new THREE.Mesh(bodyGeo, bodyMat);
                    body.position.y = 0.5;
                    body.castShadow = true;
                    group.add(body);

                    // Head
                    const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
                    const headMat = new THREE.MeshStandardMaterial({ color: charType.secondaryColor });
                    const head = new THREE.Mesh(headGeo, headMat);
                    head.position.y = 1.3;
                    head.castShadow = true;
                    group.add(head);
                    break;

                case 'tree':
                    // Trunk
                    const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 0.8, 8);
                    const trunkMat = new THREE.MeshStandardMaterial({ color: charType.secondaryColor });
                    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                    trunk.position.y = 0.4;
                    trunk.castShadow = true;
                    group.add(trunk);

                    // Leaves
                    const leavesGeo = new THREE.SphereGeometry(0.6, 8, 8);
                    const leavesMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                    leaves.position.y = 1.2;
                    leaves.castShadow = true;
                    group.add(leaves);
                    break;

                case 'bird':
                    // Body
                    const birdBodyGeo = new THREE.SphereGeometry(0.4, 16, 16);
                    const birdBodyMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const birdBody = new THREE.Mesh(birdBodyGeo, birdBodyMat);
                    birdBody.scale.set(1, 0.8, 1.2);
                    birdBody.position.y = 0.5;
                    birdBody.castShadow = true;
                    group.add(birdBody);

                    // Beak
                    const beakGeo = new THREE.ConeGeometry(0.1, 0.3, 8);
                    const beakMat = new THREE.MeshStandardMaterial({ color: charType.secondaryColor });
                    const beak = new THREE.Mesh(beakGeo, beakMat);
                    beak.rotation.z = Math.PI / 2;
                    beak.position.set(0.35, 0.5, 0);
                    beak.castShadow = true;
                    group.add(beak);
                    break;

                case 'chair':
                    // Seat
                    const seatGeo = new THREE.BoxGeometry(0.6, 0.1, 0.6);
                    const chairMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const seat = new THREE.Mesh(seatGeo, chairMat);
                    seat.position.y = 0.5;
                    seat.castShadow = true;
                    group.add(seat);

                    // Back
                    const backGeo = new THREE.BoxGeometry(0.6, 0.6, 0.1);
                    const back = new THREE.Mesh(backGeo, chairMat);
                    back.position.set(0, 0.8, -0.25);
                    back.castShadow = true;
                    group.add(back);

                    // Legs
                    const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8);
                    for(let i = 0; i < 4; i++) {
                        const leg = new THREE.Mesh(legGeo, chairMat);
                        leg.position.set(i % 2 ? 0.25 : -0.25, 0.25, i < 2 ? 0.25 : -0.25);
                        leg.castShadow = true;
                        group.add(leg);
                    }
                    break;

                case 'bear':
                    // Body
                    const bearBodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
                    const bearBodyMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const bearBody = new THREE.Mesh(bearBodyGeo, bearBodyMat);
                    bearBody.scale.set(1, 1.2, 0.8);
                    bearBody.position.y = 0.6;
                    bearBody.castShadow = true;
                    group.add(bearBody);

                    // Head
                    const bearHeadGeo = new THREE.SphereGeometry(0.35, 16, 16);
                    const bearHead = new THREE.Mesh(bearHeadGeo, bearBodyMat);
                    bearHead.position.y = 1.2;
                    bearHead.castShadow = true;
                    group.add(bearHead);

                    // Ears
                    const earGeo = new THREE.SphereGeometry(0.15, 8, 8);
                    const ear1 = new THREE.Mesh(earGeo, bearBodyMat);
                    ear1.position.set(-0.25, 1.4, 0);
                    ear1.castShadow = true;
                    group.add(ear1);
                    const ear2 = ear1.clone();
                    ear2.position.x = 0.25;
                    group.add(ear2);

                    // Snout
                    const snoutGeo = new THREE.SphereGeometry(0.2, 12, 12);
                    const snoutMat = new THREE.MeshStandardMaterial({ color: charType.secondaryColor });
                    const snout = new THREE.Mesh(snoutGeo, snoutMat);
                    snout.scale.set(0.7, 0.6, 1);
                    snout.position.set(0, 1.1, 0.25);
                    snout.castShadow = true;
                    group.add(snout);
                    break;

                case 'plant':
                    // Pot
                    const potGeo = new THREE.CylinderGeometry(0.25, 0.2, 0.4, 8);
                    const potMat = new THREE.MeshStandardMaterial({ color: charType.secondaryColor });
                    const pot = new THREE.Mesh(potGeo, potMat);
                    pot.position.y = 0.2;
                    pot.castShadow = true;
                    group.add(pot);

                    // Stem
                    const stemGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.8, 8);
                    const stemMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
                    const stem = new THREE.Mesh(stemGeo, stemMat);
                    stem.position.y = 0.8;
                    stem.castShadow = true;
                    group.add(stem);

                    // Leaves
                    const leafGeo = new THREE.SphereGeometry(0.15, 8, 8);
                    const leafMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    for(let i = 0; i < 3; i++) {
                        const leaf = new THREE.Mesh(leafGeo, leafMat);
                        leaf.scale.set(1.5, 0.5, 0.5);
                        leaf.position.set(i % 2 ? 0.2 : -0.2, 0.8 + i * 0.2, 0);
                        leaf.castShadow = true;
                        group.add(leaf);
                    }
                    break;

                case 'dog-sports':
                case 'cat-sports':
                    // Body with jersey
                    const jerseyGeo = new THREE.BoxGeometry(0.6, 0.8, 0.5);
                    const jerseyMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const jersey = new THREE.Mesh(jerseyGeo, jerseyMat);
                    jersey.position.y = 0.6;
                    jersey.castShadow = true;
                    group.add(jersey);

                    // Head
                    const animalHeadGeo = new THREE.SphereGeometry(0.3, 16, 16);
                    const animalHeadMat = new THREE.MeshStandardMaterial({ color: charType.secondaryColor });
                    const animalHead = new THREE.Mesh(animalHeadGeo, animalHeadMat);
                    animalHead.position.y = 1.2;
                    animalHead.castShadow = true;
                    group.add(animalHead);

                    // Ears
                    if(charType.id === 'dog-sports') {
                        const dogEarGeo = new THREE.BoxGeometry(0.15, 0.3, 0.05);
                        const dogEar1 = new THREE.Mesh(dogEarGeo, animalHeadMat);
                        dogEar1.position.set(-0.25, 1.3, 0);
                        dogEar1.rotation.z = 0.3;
                        dogEar1.castShadow = true;
                        group.add(dogEar1);
                        const dogEar2 = dogEar1.clone();
                        dogEar2.position.x = 0.25;
                        dogEar2.rotation.z = -0.3;
                        group.add(dogEar2);
                    } else {
                        const catEarGeo = new THREE.ConeGeometry(0.12, 0.25, 8);
                        const catEar1 = new THREE.Mesh(catEarGeo, animalHeadMat);
                        catEar1.position.set(-0.2, 1.45, 0);
                        catEar1.castShadow = true;
                        group.add(catEar1);
                        const catEar2 = catEar1.clone();
                        catEar2.position.x = 0.2;
                        group.add(catEar2);
                    }
                    break;

                case 'basketball':
                    const ballGeo = new THREE.SphereGeometry(0.5, 20, 20);
                    const ballMat = new THREE.MeshStandardMaterial({
                        color: charType.primaryColor,
                        roughness: 0.7
                    });
                    const ball = new THREE.Mesh(ballGeo, ballMat);
                    ball.position.y = 0.5;
                    ball.castShadow = true;
                    group.add(ball);

                    // Lines
                    const lineGeo = new THREE.TorusGeometry(0.5, 0.02, 8, 32);
                    const lineMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
                    const line1 = new THREE.Mesh(lineGeo, lineMat);
                    line1.position.y = 0.5;
                    line1.rotation.x = Math.PI / 2;
                    group.add(line1);
                    break;

                case 'king':
                case 'queen':
                    // Robe/Dress
                    const robeGeo = charType.id === 'king' ?
                        new THREE.BoxGeometry(0.7, 1, 0.5) :
                        new THREE.CylinderGeometry(0.1, 0.5, 1, 8);
                    const robeMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const robe = new THREE.Mesh(robeGeo, robeMat);
                    robe.position.y = 0.5;
                    robe.castShadow = true;
                    group.add(robe);

                    // Head
                    const royalHeadGeo = new THREE.SphereGeometry(0.25, 16, 16);
                    const royalHeadMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
                    const royalHead = new THREE.Mesh(royalHeadGeo, royalHeadMat);
                    royalHead.position.y = 1.2;
                    royalHead.castShadow = true;
                    group.add(royalHead);

                    // Crown
                    const crownGeo = new THREE.CylinderGeometry(0.28, 0.25, 0.2, 8);
                    const crownMat = new THREE.MeshStandardMaterial({
                        color: charType.secondaryColor,
                        metalness: 0.8,
                        roughness: 0.2
                    });
                    const crown = new THREE.Mesh(crownGeo, crownMat);
                    crown.position.y = 1.45;
                    crown.castShadow = true;
                    group.add(crown);

                    // Crown points
                    const pointGeo = new THREE.ConeGeometry(0.08, 0.15, 8);
                    for(let i = 0; i < 5; i++) {
                        const point = new THREE.Mesh(pointGeo, crownMat);
                        const angle = (i / 5) * Math.PI * 2;
                        point.position.set(
                            Math.cos(angle) * 0.27,
                            1.6,
                            Math.sin(angle) * 0.27
                        );
                        point.castShadow = true;
                        group.add(point);
                    }
                    break;

                case 'penguin':
                    // Body
                    const penguinBodyGeo = new THREE.SphereGeometry(0.4, 16, 16);
                    const penguinBodyMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const penguinBody = new THREE.Mesh(penguinBodyGeo, penguinBodyMat);
                    penguinBody.scale.set(1, 1.3, 0.9);
                    penguinBody.position.y = 0.6;
                    penguinBody.castShadow = true;
                    group.add(penguinBody);

                    // Belly
                    const bellyGeo = new THREE.SphereGeometry(0.3, 16, 16);
                    const bellyMat = new THREE.MeshStandardMaterial({ color: charType.secondaryColor });
                    const belly = new THREE.Mesh(bellyGeo, bellyMat);
                    belly.scale.set(1, 1.2, 0.5);
                    belly.position.set(0, 0.6, 0.2);
                    belly.castShadow = true;
                    group.add(belly);

                    // Beak
                    const penguinBeakGeo = new THREE.ConeGeometry(0.08, 0.15, 8);
                    const penguinBeakMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
                    const penguinBeak = new THREE.Mesh(penguinBeakGeo, penguinBeakMat);
                    penguinBeak.rotation.z = Math.PI / 2;
                    penguinBeak.position.set(0.25, 0.8, 0);
                    penguinBeak.castShadow = true;
                    group.add(penguinBeak);
                    break;

                case 'rabbit':
                    // Body
                    const rabbitBodyGeo = new THREE.SphereGeometry(0.4, 16, 16);
                    const rabbitBodyMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const rabbitBody = new THREE.Mesh(rabbitBodyGeo, rabbitBodyMat);
                    rabbitBody.position.y = 0.4;
                    rabbitBody.castShadow = true;
                    group.add(rabbitBody);

                    // Head
                    const rabbitHeadGeo = new THREE.SphereGeometry(0.25, 16, 16);
                    const rabbitHead = new THREE.Mesh(rabbitHeadGeo, rabbitBodyMat);
                    rabbitHead.position.y = 0.8;
                    rabbitHead.castShadow = true;
                    group.add(rabbitHead);

                    // Ears (using cylinder + sphere for capsule effect)
                    const rabbitEarGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8);
                    const rabbitEarTopGeo = new THREE.SphereGeometry(0.08, 8, 8);

                    // Left ear
                    const ear1 = new THREE.Mesh(rabbitEarGeo, rabbitBodyMat);
                    ear1.position.set(-0.15, 1.3, 0);
                    ear1.castShadow = true;
                    group.add(ear1);
                    const ear1Top = new THREE.Mesh(rabbitEarTopGeo, rabbitBodyMat);
                    ear1Top.position.set(-0.15, 1.5, 0);
                    ear1Top.castShadow = true;
                    group.add(ear1Top);

                    // Right ear
                    const ear2 = ear1.clone();
                    ear2.position.x = 0.15;
                    group.add(ear2);
                    const ear2Top = ear1Top.clone();
                    ear2Top.position.x = 0.15;
                    group.add(ear2Top);

                    // Inner ears
                    const innerEarGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 8);
                    const innerEarMat = new THREE.MeshStandardMaterial({ color: charType.secondaryColor });
                    const innerEar1 = new THREE.Mesh(innerEarGeo, innerEarMat);
                    innerEar1.position.set(-0.15, 1.3, 0.05);
                    innerEar1.castShadow = true;
                    group.add(innerEar1);
                    const innerEar2 = innerEar1.clone();
                    innerEar2.position.x = 0.15;
                    group.add(innerEar2);
                    break;

                case 'flower':
                    // Stem
                    const flowerStemGeo = new THREE.CylinderGeometry(0.05, 0.05, 1, 8);
                    const flowerStemMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
                    const flowerStem = new THREE.Mesh(flowerStemGeo, flowerStemMat);
                    flowerStem.position.y = 0.5;
                    flowerStem.castShadow = true;
                    group.add(flowerStem);

                    // Flower center
                    const centerGeo = new THREE.SphereGeometry(0.15, 16, 16);
                    const centerMat = new THREE.MeshStandardMaterial({ color: charType.secondaryColor });
                    const center = new THREE.Mesh(centerGeo, centerMat);
                    center.position.y = 1;
                    center.castShadow = true;
                    group.add(center);

                    // Petals
                    const petalGeo = new THREE.SphereGeometry(0.15, 12, 12);
                    const petalMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    for(let i = 0; i < 6; i++) {
                        const petal = new THREE.Mesh(petalGeo, petalMat);
                        const angle = (i / 6) * Math.PI * 2;
                        petal.position.set(
                            Math.cos(angle) * 0.25,
                            1,
                            Math.sin(angle) * 0.25
                        );
                        petal.scale.set(1, 0.5, 0.8);
                        petal.castShadow = true;
                        group.add(petal);
                    }
                    break;

                case 'cactus':
                    // Main body
                    const cactusBodyGeo = new THREE.CylinderGeometry(0.25, 0.25, 1.2, 8);
                    const cactusMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const cactusBody = new THREE.Mesh(cactusBodyGeo, cactusMat);
                    cactusBody.position.y = 0.6;
                    cactusBody.castShadow = true;
                    group.add(cactusBody);

                    // Arms
                    const armGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.5, 8);
                    const arm1 = new THREE.Mesh(armGeo, cactusMat);
                    arm1.rotation.z = Math.PI / 2;
                    arm1.position.set(-0.35, 0.7, 0);
                    arm1.castShadow = true;
                    group.add(arm1);

                    const arm2 = new THREE.Mesh(armGeo, cactusMat);
                    arm2.rotation.z = -Math.PI / 2;
                    arm2.position.set(0.35, 0.5, 0);
                    arm2.castShadow = true;
                    group.add(arm2);

                    // Spines
                    const spineGeo = new THREE.ConeGeometry(0.02, 0.1, 6);
                    const spineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                    for(let i = 0; i < 20; i++) {
                        const spine = new THREE.Mesh(spineGeo, spineMat);
                        const angle = Math.random() * Math.PI * 2;
                        const height = Math.random();
                        spine.position.set(
                            Math.cos(angle) * 0.28,
                            height * 1.2,
                            Math.sin(angle) * 0.28
                        );
                        spine.rotation.z = angle;
                        spine.rotation.x = Math.PI / 2;
                        group.add(spine);
                    }
                    break;

                default:
                    // Default simple character
                    const defaultGeo = new THREE.SphereGeometry(0.5, 16, 16);
                    const defaultMat = new THREE.MeshStandardMaterial({ color: charType.primaryColor });
                    const defaultMesh = new THREE.Mesh(defaultGeo, defaultMat);
                    defaultMesh.position.y = 0.5;
                    defaultMesh.castShadow = true;
                    group.add(defaultMesh);
            }

            return group;
        }

        // Create obstacle
        function createObstacle() {
            const height = Math.random() * 1.5 + 1;
            const geometry = new THREE.BoxGeometry(0.5, height, 0.5);
            const material = new THREE.MeshStandardMaterial({
                color: 0xe74c3c,
                roughness: 0.7
            });
            const obstacle = new THREE.Mesh(geometry, material);
            obstacle.position.set(0, height / 2, -30);
            obstacle.castShadow = true;
            obstacle.receiveShadow = true;
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        // Create coin
        function createCoin() {
            const geometry = new THREE.TorusGeometry(0.3, 0.1, 8, 16);
            const material = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                metalness: 0.8,
                roughness: 0.2,
                emissive: 0xffaa00,
                emissiveIntensity: 0.3
            });
            const coin = new THREE.Mesh(geometry, material);
            coin.position.set(
                (Math.random() - 0.5) * 4,
                0.5 + Math.random() * 2,
                -30
            );
            coin.rotation.x = Math.PI / 2;
            coin.castShadow = true;
            coin.userData.collected = false;
            scene.add(coin);
            coins.push(coin);
        }

        // Initialize character selection
        function initCharacterSelect() {
            const grid = document.getElementById('characterGrid');
            characters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'character-card';
                if (char.id === selectedCharacter.id) {
                    card.classList.add('selected');
                }
                card.innerHTML = `
                    <div class="character-icon">${char.icon}</div>
                    <div class="character-name">${char.name}</div>
                `;
                card.onclick = () => selectCharacter(char, card);
                grid.appendChild(card);
            });
        }

        function selectCharacter(char, cardElement) {
            selectedCharacter = char;
            document.querySelectorAll('.character-card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');
            document.getElementById('currentCharacter').textContent = char.name;
        }

        function showCharacterSelect() {
            gameRunning = false;
            document.getElementById('characterSelect').classList.remove('hidden');
            document.getElementById('gameOver').classList.remove('active');
        }

        // Make startGame globally accessible
        window.startGame = function() {
            console.log('Start game button clicked!');
            try {
                document.getElementById('characterSelect').classList.add('hidden');
                gameRunning = true;
                restartGame();
                console.log('Game started successfully');
            } catch (error) {
                console.error('Error starting game:', error);
                alert('Error starting game: ' + error.message);
            }
        };

        // Input handling
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;

            if ((e.key === ' ' || e.key === 'Spacebar') && !isJumping && gameRunning) {
                playerVelocityY = jumpPower;
                isJumping = true;
            }
            if (e.key.toLowerCase() === 'c' && gameRunning) {
                showCharacterSelect();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Update high score display
        document.getElementById('highScore').textContent = highScore;

        function updatePlayer() {
            if (!gameRunning || !player) return;

            // Horizontal movement
            if (keys['a'] || keys['arrowleft']) {
                player.position.x = Math.max(-3, player.position.x - 0.1);
            }
            if (keys['d'] || keys['arrowright']) {
                player.position.x = Math.min(3, player.position.x + 0.1);
            }

            // Vertical movement (gravity and jumping)
            playerVelocityY += gravity;
            player.position.y += playerVelocityY;

            // Ground collision
            if (player.position.y <= 0) {
                player.position.y = 0;
                playerVelocityY = 0;
                isJumping = false;
            }

            // Camera follows player
            camera.position.x = player.position.x * 0.3;
            camera.lookAt(player.position.x * 0.2, 1, 0);

            // Idle animation - slight bobbing
            if (!isJumping) {
                player.rotation.y = Math.sin(Date.now() * 0.002) * 0.1;
            }
        }

        function updateObstacles() {
            obstacles = obstacles.filter(obs => {
                obs.position.z += gameSpeed;

                // Check collision with player
                if (player &&
                    Math.abs(player.position.x - obs.position.x) < 0.6 &&
                    Math.abs(player.position.z - obs.position.z) < 0.6 &&
                    player.position.y < obs.geometry.parameters.height) {
                    gameOver();
                    return false;
                }

                // Remove if passed player
                if (obs.position.z > 5) {
                    scene.remove(obs);
                    return false;
                }

                return true;
            });
        }

        function updateCoins() {
            coins = coins.filter(coin => {
                coin.position.z += gameSpeed;
                coin.rotation.y += 0.05;

                // Check collision with player
                if (!coin.userData.collected && player) {
                    const dx = player.position.x - coin.position.x;
                    const dy = player.position.y + 0.5 - coin.position.y;
                    const dz = player.position.z - coin.position.z;
                    const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    if (distance < 0.7) {
                        coin.userData.collected = true;
                        score += 10;
                        document.getElementById('score').textContent = score;
                        scene.remove(coin);
                        return false;
                    }
                }

                // Remove if passed player
                if (coin.position.z > 5) {
                    scene.remove(coin);
                    return false;
                }

                return true;
            });
        }

        function updateLevel() {
            const newLevel = Math.floor(score / 100) + 1;
            if (newLevel > level) {
                level = newLevel;
                gameSpeed = 0.05 + (level - 1) * 0.01;
                document.getElementById('level').textContent = level;
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('gameOver').classList.add('active');
            document.getElementById('finalScore').textContent = score;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }

            document.getElementById('finalHighScore').textContent = highScore;
        }

        function restartGame() {
            gameRunning = true;
            score = 0;
            level = 1;
            gameSpeed = 0.05;
            frameCount = 0;
            playerVelocityY = 0;
            isJumping = false;

            // Clear obstacles and coins
            obstacles.forEach(obs => scene.remove(obs));
            coins.forEach(coin => scene.remove(coin));
            obstacles = [];
            coins = [];

            // Remove old player
            if (player) {
                scene.remove(player);
            }

            // Create new player
            player = createCharacter(selectedCharacter);
            player.position.set(0, 0, 0);
            scene.add(player);

            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('gameOver').classList.remove('active');

            if (!document.getElementById('characterSelect').classList.contains('hidden')) {
                document.getElementById('characterSelect').classList.add('hidden');
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameRunning) {
                updatePlayer();
                updateObstacles();
                updateCoins();
                updateLevel();

                frameCount++;
                if (frameCount % 120 === 0) {
                    createObstacle();
                }
                if (frameCount % 80 === 0) {
                    createCoin();
                }
            }

            renderer.render(scene, camera);
        }

        // Make functions globally accessible for onclick handlers
        window.restartGame = restartGame;
        window.showCharacterSelect = showCharacterSelect;

        // Initialize
        try {
            initScene();
            console.log('Scene initialized successfully');
            initCharacterSelect();
            console.log('Character select initialized successfully');
            animate();
            console.log('Animation started successfully');
            console.log('startGame function is defined:', typeof window.startGame);
            console.log('restartGame function is defined:', typeof window.restartGame);
        } catch (error) {
            console.error('Initialization error:', error);
            alert('Error loading game: ' + error.message + '\n\nPlease refresh the page.');
        }
    </script>
</body>
</html>
