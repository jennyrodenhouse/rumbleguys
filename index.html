<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marshmallow Mayhem 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 50%, #6C5B7B 100%);
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .game-title {
            text-align: center;
            color: #fff;
            font-size: 3em;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .score-item {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 15px;
            color: #fff;
            font-size: 1.3em;
            font-weight: bold;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .score-value {
            color: #FFD700;
            font-size: 1.2em;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 1.2em;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 40px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 50px;
            border-radius: 30px;
            display: none;
            z-index: 150;
            text-align: center;
            border: 5px solid #ff6b6b;
            pointer-events: all;
        }

        .game-over.active {
            display: block;
        }

        .game-over h2 {
            font-size: 4em;
            margin-bottom: 20px;
            color: #ff6b6b;
            text-shadow: 3px 3px 10px rgba(255, 107, 107, 0.5);
        }

        .game-over p {
            font-size: 1.8em;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 100%);
            color: #fff;
            border: none;
            padding: 20px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            margin: 10px;
            font-weight: bold;
            pointer-events: all;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 100, 0, 0.95);
            color: #fff;
            padding: 30px 60px;
            border-radius: 20px;
            font-size: 2em;
            font-weight: bold;
            display: none;
            z-index: 140;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }

        .warning.active {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="ui-overlay">
        <h1 class="game-title">🔥 MARSHMALLOW MAYHEM 3D 🔥</h1>
        <div class="score-board">
            <div class="score-item">Distance: <span class="score-value" id="distance">0</span>m</div>
            <div class="score-item">Survived: <span class="score-value" id="time">0</span>s</div>
            <div class="score-item">Best: <span class="score-value" id="bestTime">0</span>s</div>
        </div>
    </div>

    <div class="controls">
        ⬅️ A/D or ARROWS to Move | SPACE to Jump | Dodge Fire & CPU Marshmallows!
    </div>

    <div class="warning" id="fireWarning">
        🔥 FIRE APPROACHING! 🔥
    </div>

    <div class="game-over" id="gameOver">
        <h2>MARSHMALLOW TOASTED!</h2>
        <p>You survived: <span id="finalTime">0</span> seconds</p>
        <p>Distance: <span id="finalDistance">0</span> meters</p>
        <p>Best Time: <span id="finalBestTime">0</span> seconds</p>
        <button onclick="restartGame()">TRY AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Check if Three.js loaded
        if (typeof THREE === 'undefined') {
            alert('Three.js failed to load! Please check your internet connection and refresh the page.');
        }

        // Game variables
        let scene, camera, renderer;
        let player, fireWall;
        let cpuMarshmallows = [];
        let obstacles = [];
        let gameRunning = true;
        let distance = 0;
        let survivalTime = 0;
        let bestTime = localStorage.getItem('bestTime') || 0;
        let gameSpeed = 0.1;
        let fireSpeed = 0.05;
        let frameCount = 0;
        let playerVelocityY = 0;
        let playerVelocityX = 0;
        let isJumping = false;
        const gravity = -0.02;
        const jumpPower = 0.5;
        const moveSpeed = 0.15;
        const keys = {};

        // Update displays
        document.getElementById('bestTime').textContent = bestTime;

        // Initialize Three.js scene
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 15);
            camera.lookAt(0, 2, 0);

            // Renderer
            const canvas = document.getElementById('gameCanvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            scene.add(directionalLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(100, 200);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x90EE90,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid
            const gridHelper = new THREE.GridHelper(100, 50, 0x228b22, 0x228b22);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Create marshmallow character
        function createMarshmallow(color = 0xFFFFFF) {
            const group = new THREE.Group();

            // Body (soft, squishy marshmallow)
            const bodyGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.5,
                metalness: 0.1
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.scale.set(1, 1.3, 0.9);
            body.position.y = 0.8;
            body.castShadow = true;
            group.add(body);

            // Head (smaller marshmallow on top)
            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.y = 1.6;
            head.castShadow = true;
            group.add(head);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });

            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.15, 1.65, 0.35);
            group.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.15, 1.65, 0.35);
            group.add(rightEye);

            // Smile
            const smileCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-0.15, 1.5, 0.38),
                new THREE.Vector3(0, 1.45, 0.4),
                new THREE.Vector3(0.15, 1.5, 0.38)
            ]);
            const smileGeo = new THREE.TubeGeometry(smileCurve, 10, 0.03, 8, false);
            const smileMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const smile = new THREE.Mesh(smileGeo, smileMat);
            group.add(smile);

            // Arms
            const armGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const leftArm = new THREE.Mesh(armGeo, bodyMat);
            leftArm.scale.set(2, 0.8, 0.8);
            leftArm.position.set(-0.65, 1, 0);
            leftArm.castShadow = true;
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, bodyMat);
            rightArm.scale.set(2, 0.8, 0.8);
            rightArm.position.set(0.65, 1, 0);
            rightArm.castShadow = true;
            group.add(rightArm);

            // Legs
            const legGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.5, 8);
            const leftLeg = new THREE.Mesh(legGeo, bodyMat);
            leftLeg.position.set(-0.25, 0.25, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, bodyMat);
            rightLeg.position.set(0.25, 0.25, 0);
            rightLeg.castShadow = true;
            group.add(rightLeg);

            return group;
        }

        // Create fire wall
        function createFireWall() {
            const group = new THREE.Group();

            // Main fire wall
            const wallGeo = new THREE.BoxGeometry(20, 10, 2);
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0xff4500,
                emissive: 0xff6600,
                emissiveIntensity: 0.8
            });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.y = 5;
            group.add(wall);

            // Flames
            for (let i = 0; i < 10; i++) {
                const flameGeo = new THREE.ConeGeometry(0.5, 2, 8);
                const flameMat = new THREE.MeshStandardMaterial({
                    color: Math.random() > 0.5 ? 0xff6600 : 0xffaa00,
                    emissive: 0xff4500,
                    emissiveIntensity: 1
                });
                const flame = new THREE.Mesh(flameGeo, flameMat);
                flame.position.set(
                    (Math.random() - 0.5) * 18,
                    Math.random() * 8 + 1,
                    (Math.random() - 0.5) * 2
                );
                flame.userData.oscillate = Math.random() * Math.PI * 2;
                group.add(flame);
            }

            group.position.z = -50;
            return group;
        }

        // Create CPU marshmallow opponent
        function createCPUMarshmallow() {
            const colors = [0xFFB6C1, 0xFFE4B5, 0xE6E6FA, 0xF0E68C, 0xDDA0DD];
            const cpu = createMarshmallow(colors[Math.floor(Math.random() * colors.length)]);

            cpu.position.set(
                (Math.random() - 0.5) * 15,
                0,
                -Math.random() * 30 - 10
            );

            cpu.userData.speed = 0.05 + Math.random() * 0.05;
            cpu.userData.lane = cpu.position.x;
            cpu.userData.wobble = Math.random() * Math.PI * 2;

            return cpu;
        }

        // Create obstacle
        function createObstacle() {
            const obstacleTypes = ['rock', 'log'];
            const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];

            let obstacle;
            if (type === 'rock') {
                const geo = new THREE.DodecahedronGeometry(0.8, 0);
                const mat = new THREE.MeshStandardMaterial({ color: 0x808080 });
                obstacle = new THREE.Mesh(geo, mat);
            } else {
                const geo = new THREE.CylinderGeometry(0.4, 0.4, 2, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                obstacle = new THREE.Mesh(geo, mat);
                obstacle.rotation.z = Math.PI / 2;
            }

            obstacle.position.set(
                (Math.random() - 0.5) * 15,
                0.5,
                -50
            );
            obstacle.castShadow = true;
            obstacle.receiveShadow = true;

            return obstacle;
        }

        // Initialize game
        function initGame() {
            initScene();

            // Create player marshmallow
            player = createMarshmallow(0xFFFFFF);
            player.position.set(0, 0, 0);
            scene.add(player);

            // Create fire wall
            fireWall = createFireWall();
            scene.add(fireWall);

            // Create CPU marshmallows
            for (let i = 0; i < 5; i++) {
                const cpu = createCPUMarshmallow();
                scene.add(cpu);
                cpuMarshmallows.push(cpu);
            }

            // Create initial obstacles
            for (let i = 0; i < 3; i++) {
                const obstacle = createObstacle();
                scene.add(obstacle);
                obstacles.push(obstacle);
            }
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;

            if ((e.key === ' ' || e.key === 'Spacebar') && !isJumping && gameRunning) {
                playerVelocityY = jumpPower;
                isJumping = true;
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Update player
        function updatePlayer() {
            if (!gameRunning || !player) return;

            // Horizontal movement
            if (keys['a'] || keys['arrowleft']) {
                playerVelocityX = -moveSpeed;
            } else if (keys['d'] || keys['arrowright']) {
                playerVelocityX = moveSpeed;
            } else {
                playerVelocityX *= 0.8; // Friction
            }

            player.position.x += playerVelocityX;
            player.position.x = Math.max(-8, Math.min(8, player.position.x)); // Keep in bounds

            // Vertical movement (jumping)
            playerVelocityY += gravity;
            player.position.y += playerVelocityY;

            // Ground collision
            if (player.position.y <= 0) {
                player.position.y = 0;
                playerVelocityY = 0;
                isJumping = false;
            }

            // Running animation
            if (!isJumping) {
                player.rotation.z = Math.sin(frameCount * 0.2) * 0.1;
                player.children[4].rotation.x = Math.sin(frameCount * 0.3) * 0.3; // Left leg
                player.children[5].rotation.x = Math.sin(frameCount * 0.3 + Math.PI) * 0.3; // Right leg
            }

            // Camera follows player
            camera.position.x = player.position.x * 0.3;
            camera.lookAt(player.position.x * 0.2, 2, 0);
        }

        // Update fire wall
        function updateFireWall() {
            if (!fireWall) return;

            fireWall.position.z += fireSpeed;

            // Animate flames
            fireWall.children.forEach((child, index) => {
                if (index > 0) { // Skip the wall itself
                    child.userData.oscillate += 0.1;
                    child.position.y += Math.sin(child.userData.oscillate) * 0.02;
                    child.scale.y = 1 + Math.sin(child.userData.oscillate) * 0.2;
                }
            });

            // Check if fire caught player
            if (fireWall.position.z > player.position.z - 2) {
                gameOver('TOASTED BY FIRE');
            }

            // Fire warning
            const fireWarning = document.getElementById('fireWarning');
            if (fireWall.position.z > player.position.z - 15) {
                fireWarning.classList.add('active');
            } else {
                fireWarning.classList.remove('active');
            }
        }

        // Update CPU marshmallows
        function updateCPUs() {
            cpuMarshmallows.forEach((cpu, index) => {
                cpu.position.z += cpu.userData.speed;

                // Wobble movement
                cpu.userData.wobble += 0.05;
                cpu.position.x = cpu.userData.lane + Math.sin(cpu.userData.wobble) * 1.5;

                // Running animation
                cpu.rotation.z = Math.sin(frameCount * 0.2 + index) * 0.1;

                // Check collision with player
                const dx = player.position.x - cpu.position.x;
                const dz = player.position.z - cpu.position.z;
                const distance = Math.sqrt(dx * dx + dz * dz);

                if (distance < 1.5 && Math.abs(player.position.y - cpu.position.y) < 1) {
                    gameOver('HIT BY CPU MARSHMALLOW');
                }

                // Remove and respawn if passed
                if (cpu.position.z > 10) {
                    cpu.position.z = -Math.random() * 30 - 20;
                    cpu.position.x = (Math.random() - 0.5) * 15;
                    cpu.userData.lane = cpu.position.x;
                }
            });
        }

        // Update obstacles
        function updateObstacles() {
            obstacles = obstacles.filter(obs => {
                obs.position.z += gameSpeed;

                // Rotate obstacles
                obs.rotation.y += 0.02;

                // Check collision
                const dx = player.position.x - obs.position.x;
                const dz = player.position.z - obs.position.z;
                const distance = Math.sqrt(dx * dx + dz * dz);

                if (distance < 1.2 && player.position.y < 1) {
                    gameOver('HIT OBSTACLE');
                    return false;
                }

                // Remove if passed
                if (obs.position.z > 10) {
                    scene.remove(obs);
                    return false;
                }

                return true;
            });
        }

        // Game over
        function gameOver(reason) {
            gameRunning = false;
            console.log('Game Over:', reason);

            document.getElementById('gameOver').classList.add('active');
            document.getElementById('finalTime').textContent = survivalTime;
            document.getElementById('finalDistance').textContent = distance;

            if (survivalTime > bestTime) {
                bestTime = survivalTime;
                localStorage.setItem('bestTime', bestTime);
            }

            document.getElementById('finalBestTime').textContent = bestTime;
        }

        // Restart game
        window.restartGame = function() {
            // Clear scene
            cpuMarshmallows.forEach(cpu => scene.remove(cpu));
            obstacles.forEach(obs => scene.remove(obs));
            if (player) scene.remove(player);
            if (fireWall) scene.remove(fireWall);

            cpuMarshmallows = [];
            obstacles = [];

            gameRunning = true;
            distance = 0;
            survivalTime = 0;
            frameCount = 0;
            playerVelocityY = 0;
            playerVelocityX = 0;
            isJumping = false;
            fireSpeed = 0.05;

            document.getElementById('distance').textContent = distance;
            document.getElementById('time').textContent = survivalTime;
            document.getElementById('gameOver').classList.remove('active');
            document.getElementById('fireWarning').classList.remove('active');

            // Recreate player
            player = createMarshmallow(0xFFFFFF);
            player.position.set(0, 0, 0);
            scene.add(player);

            // Recreate fire
            fireWall = createFireWall();
            scene.add(fireWall);

            // Recreate CPUs
            for (let i = 0; i < 5; i++) {
                const cpu = createCPUMarshmallow();
                scene.add(cpu);
                cpuMarshmallows.push(cpu);
            }

            // Recreate obstacles
            for (let i = 0; i < 3; i++) {
                const obstacle = createObstacle();
                scene.add(obstacle);
                obstacles.push(obstacle);
            }
        };

        // Game loop
        function animate() {
            requestAnimationFrame(animate);

            if (gameRunning) {
                frameCount++;

                // Update survival time
                if (frameCount % 60 === 0) {
                    survivalTime++;
                    document.getElementById('time').textContent = survivalTime;
                }

                // Update distance
                distance = Math.floor(frameCount * 0.1);
                document.getElementById('distance').textContent = distance;

                // Increase difficulty
                gameSpeed = 0.1 + (survivalTime * 0.002);
                fireSpeed = 0.05 + (survivalTime * 0.001);

                updatePlayer();
                updateFireWall();
                updateCPUs();
                updateObstacles();

                // Spawn new obstacles
                if (frameCount % 120 === 0) {
                    const obstacle = createObstacle();
                    scene.add(obstacle);
                    obstacles.push(obstacle);
                }
            }

            renderer.render(scene, camera);
        }

        // Initialize and start
        initGame();
        animate();
    </script>
</body>
</html>
