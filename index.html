<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumble Guys - Web Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #fff;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        .score-board {
            color: #fff;
            font-size: 1.5em;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            max-width: 600px;
            margin: 0 auto 20px;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
        }

        canvas {
            border: 4px solid #fff;
            border-radius: 10px;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8E8 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: block;
            margin: 0 auto;
        }

        .controls {
            color: #fff;
            margin-top: 20px;
            font-size: 1.1em;
        }

        .character-select {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 40px;
            border-radius: 20px;
            z-index: 15;
            text-align: center;
            max-width: 800px;
        }

        .character-select.hidden {
            display: none;
        }

        .character-select h2 {
            font-size: 2.5em;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .character-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            border-color: #667eea;
        }

        .character-card.selected {
            background: rgba(102, 126, 234, 0.4);
            border-color: #f093fb;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
        }

        .character-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .character-name {
            font-size: 0.9em;
            font-weight: bold;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 40px;
            border-radius: 20px;
            display: none;
            z-index: 10;
            text-align: center;
        }

        .game-over.active {
            display: block;
        }

        .game-over h2 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        .game-over p {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            color: #fff;
            margin-top: 15px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .current-character {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="character-select" id="characterSelect">
        <h2>Choose Your Character!</h2>
        <div class="character-grid" id="characterGrid"></div>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div class="game-container">
        <h1>🎮 RUMBLE GUYS 🎮</h1>
        <div class="current-character">
            Playing as: <span id="currentCharacter">Human</span>
        </div>
        <div class="score-board">
            <div class="score-item">Score: <span id="score">0</span></div>
            <div class="score-item">High Score: <span id="highScore">0</span></div>
            <div class="score-item">Level: <span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="controls">
            <p>⬅️ LEFT ARROW | RIGHT ARROW ➡️ | SPACE to Jump | C to Change Character</p>
        </div>
        <div class="instructions">
            <p>Dodge the red obstacles! Collect yellow coins! Survive as long as possible!</p>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>GAME OVER!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>High Score: <span id="finalHighScore">0</span></p>
        <button onclick="restartGame()">Play Again</button>
        <button onclick="showCharacterSelect()">Change Character</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverScreen = document.getElementById('gameOver');
        const characterSelectScreen = document.getElementById('characterSelect');

        // Character types
        const characters = [
            { id: 'human', name: 'Human', icon: '🧍', color: '#4a90e2' },
            { id: 'tree', name: 'Tree', icon: '🌳', color: '#2d5016' },
            { id: 'bird', name: 'Bird', icon: '🐦', color: '#ffcc00' },
            { id: 'chair', name: 'Chair', icon: '🪑', color: '#8b4513' },
            { id: 'bear', name: 'Bear', icon: '🐻', color: '#8b4513' },
            { id: 'plant', name: 'Plant', icon: '🌱', color: '#22c55e' },
            { id: 'dog-sports', name: 'Sports Dog', icon: '🐕', color: '#ff6b6b' },
            { id: 'cat-sports', name: 'Sports Cat', icon: '🐈', color: '#ff8c42' },
            { id: 'basketball', name: 'Basketball', icon: '🏀', color: '#ff6600' },
            { id: 'king', name: 'King', icon: '🤴', color: '#ffd700' },
            { id: 'queen', name: 'Queen', icon: '👸', color: '#ff69b4' },
            { id: 'penguin', name: 'Penguin', icon: '🐧', color: '#000000' },
            { id: 'rabbit', name: 'Rabbit', icon: '🐰', color: '#d4a5a5' },
            { id: 'flower', name: 'Flower', icon: '🌺', color: '#ff1493' },
            { id: 'cactus', name: 'Cactus', icon: '🌵', color: '#3d9970' }
        ];

        let selectedCharacter = characters[0];

        // Game state
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let level = 1;
        let gameSpeed = 2;

        // Player
        const player = {
            x: 50,
            y: 300,
            width: 35,
            height: 35,
            velocityY: 0,
            jumping: false,
            gravity: 0.6,
            jumpPower: -12,
            speed: 5
        };

        // Obstacles and coins
        let obstacles = [];
        let coins = [];
        let frameCount = 0;

        // Initialize character selection
        function initCharacterSelect() {
            const grid = document.getElementById('characterGrid');
            characters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'character-card';
                if (char.id === selectedCharacter.id) {
                    card.classList.add('selected');
                }
                card.innerHTML = `
                    <div class="character-icon">${char.icon}</div>
                    <div class="character-name">${char.name}</div>
                `;
                card.onclick = () => selectCharacter(char, card);
                grid.appendChild(card);
            });
        }

        function selectCharacter(char, cardElement) {
            selectedCharacter = char;
            document.querySelectorAll('.character-card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');
            document.getElementById('currentCharacter').textContent = char.name;
        }

        function showCharacterSelect() {
            gameRunning = false;
            characterSelectScreen.classList.remove('hidden');
            gameOverScreen.classList.remove('active');
        }

        function startGame() {
            characterSelectScreen.classList.add('hidden');
            gameRunning = true;
            restartGame();
        }

        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' && !player.jumping && gameRunning) {
                player.velocityY = player.jumpPower;
                player.jumping = true;
            }
            if (e.key.toLowerCase() === 'c' && gameRunning) {
                showCharacterSelect();
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Update high score display
        document.getElementById('highScore').textContent = highScore;

        function createObstacle() {
            const height = Math.random() * 40 + 30;
            obstacles.push({
                x: canvas.width,
                y: canvas.height - height - 70,
                width: 25,
                height: height,
                speed: gameSpeed
            });
        }

        function createCoin() {
            coins.push({
                x: canvas.width,
                y: Math.random() * 200 + 100,
                radius: 10,
                speed: gameSpeed,
                collected: false
            });
        }

        function updatePlayer() {
            if (!gameRunning) return;

            // Horizontal movement
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Vertical movement (gravity and jumping)
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            // Ground collision
            const groundY = canvas.height - 100;
            if (player.y >= groundY) {
                player.y = groundY;
                player.velocityY = 0;
                player.jumping = false;
            }
        }

        function updateObstacles() {
            obstacles = obstacles.filter(obs => {
                obs.x -= obs.speed;

                // Check collision with player
                if (player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                    gameOver();
                    return false;
                }

                return obs.x + obs.width > 0;
            });
        }

        function updateCoins() {
            coins = coins.filter(coin => {
                coin.x -= coin.speed;

                // Check collision with player
                const dx = (player.x + player.width / 2) - coin.x;
                const dy = (player.y + player.height / 2) - coin.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.width / 2 + coin.radius && !coin.collected) {
                    coin.collected = true;
                    score += 10;
                    document.getElementById('score').textContent = score;
                    return false;
                }

                return coin.x + coin.radius > 0;
            });
        }

        function drawCharacter(x, y, w, h, charType) {
            ctx.save();

            switch(charType.id) {
                case 'human':
                    // Body
                    ctx.fillStyle = '#4a90e2';
                    ctx.fillRect(x, y, w, h);
                    // Head
                    ctx.fillStyle = '#ffdbac';
                    ctx.fillRect(x + 5, y - 8, w - 10, 8);
                    // Eyes
                    ctx.fillStyle = '#000';
                    ctx.fillRect(x + 10, y - 5, 3, 2);
                    ctx.fillRect(x + w - 13, y - 5, 3, 2);
                    break;

                case 'tree':
                    // Trunk
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(x + w/3, y + h/2, w/3, h/2);
                    // Leaves
                    ctx.fillStyle = '#228b22';
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/3, w/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(x + 5, y + 5, w - 10, h/3);
                    break;

                case 'bird':
                    // Body
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.ellipse(x + w/2, y + h/2, w/2, h/3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Head
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/4, w/3, 0, Math.PI * 2);
                    ctx.fill();
                    // Beak
                    ctx.fillStyle = '#ff6600';
                    ctx.beginPath();
                    ctx.moveTo(x + w/2 + w/3, y + h/4);
                    ctx.lineTo(x + w, y + h/4);
                    ctx.lineTo(x + w/2 + w/3, y + h/4 + 5);
                    ctx.fill();
                    // Wing
                    ctx.fillStyle = '#ffa500';
                    ctx.beginPath();
                    ctx.ellipse(x + w/4, y + h/2, w/4, h/4, -0.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'chair':
                    // Seat
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(x, y + h/2, w, h/6);
                    // Back
                    ctx.fillRect(x, y, w/6, h/2);
                    // Legs
                    ctx.fillRect(x + 2, y + h/2 + h/6, w/8, h/3);
                    ctx.fillRect(x + w - w/8 - 2, y + h/2 + h/6, w/8, h/3);
                    break;

                case 'bear':
                    // Body
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(x, y + h/3, w, h*2/3);
                    // Head
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/4, w/3, 0, Math.PI * 2);
                    ctx.fill();
                    // Ears
                    ctx.beginPath();
                    ctx.arc(x + w/4, y, w/6, 0, Math.PI * 2);
                    ctx.arc(x + w*3/4, y, w/6, 0, Math.PI * 2);
                    ctx.fill();
                    // Snout
                    ctx.fillStyle = '#d2b48c';
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/3, w/5, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'plant':
                    // Pot
                    ctx.fillStyle = '#cd853f';
                    ctx.fillRect(x + w/4, y + h*2/3, w/2, h/3);
                    // Stem
                    ctx.strokeStyle = '#228b22';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x + w/2, y + h*2/3);
                    ctx.lineTo(x + w/2, y + h/4);
                    ctx.stroke();
                    // Leaves
                    ctx.fillStyle = '#22c55e';
                    for(let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.ellipse(x + w/2 + (i % 2 ? 10 : -10), y + h/4 + i * 10, 8, 12, i % 2 ? 0.5 : -0.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;

                case 'dog-sports':
                case 'cat-sports':
                    // Body with jersey
                    ctx.fillStyle = charType.id === 'dog-sports' ? '#ff6b6b' : '#ff8c42';
                    ctx.fillRect(x, y + h/3, w, h*2/3);
                    // Number on jersey
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText('23', x + w/4, y + h*2/3);
                    // Head
                    ctx.fillStyle = charType.id === 'dog-sports' ? '#d2691e' : '#ffa07a';
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/4, w/3, 0, Math.PI * 2);
                    ctx.fill();
                    // Ears
                    if(charType.id === 'dog-sports') {
                        ctx.fillRect(x, y + h/6, w/5, h/4);
                        ctx.fillRect(x + w - w/5, y + h/6, w/5, h/4);
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(x + w/4, y);
                        ctx.lineTo(x + w/4 - 5, y - 8);
                        ctx.lineTo(x + w/4 + 5, y);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(x + w*3/4, y);
                        ctx.lineTo(x + w*3/4 - 5, y - 8);
                        ctx.lineTo(x + w*3/4 + 5, y);
                        ctx.fill();
                    }
                    break;

                case 'basketball':
                    // Ball
                    ctx.fillStyle = '#ff6600';
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/2, w/2, 0, Math.PI * 2);
                    ctx.fill();
                    // Lines
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/2, w/2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y + h/2);
                    ctx.quadraticCurveTo(x + w/2, y + h/4, x + w, y + h/2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y + h/2);
                    ctx.quadraticCurveTo(x + w/2, y + h*3/4, x + w, y + h/2);
                    ctx.stroke();
                    break;

                case 'king':
                    // Robe
                    ctx.fillStyle = '#8b0000';
                    ctx.fillRect(x, y + h/3, w, h*2/3);
                    // Cape
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(x - 5, y + h/3, 5, h/2);
                    ctx.fillRect(x + w, y + h/3, 5, h/2);
                    // Head
                    ctx.fillStyle = '#ffdbac';
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/4, w/3, 0, Math.PI * 2);
                    ctx.fill();
                    // Crown
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(x + w/4, y - 5, w/2, 8);
                    ctx.fillRect(x + w/4, y - 10, w/8, 5);
                    ctx.fillRect(x + w/2 - w/16, y - 10, w/8, 5);
                    ctx.fillRect(x + w*3/4 - w/8, y - 10, w/8, 5);
                    // Gems
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(x + w/4 + 2, y - 8, 3, 3);
                    ctx.fillRect(x + w/2 - 1, y - 8, 3, 3);
                    ctx.fillRect(x + w*3/4 - 5, y - 8, 3, 3);
                    break;

                case 'queen':
                    // Dress
                    ctx.fillStyle = '#ff69b4';
                    ctx.beginPath();
                    ctx.moveTo(x + w/2, y + h/3);
                    ctx.lineTo(x - 5, y + h);
                    ctx.lineTo(x + w + 5, y + h);
                    ctx.closePath();
                    ctx.fill();
                    // Torso
                    ctx.fillRect(x + w/4, y + h/3, w/2, h/4);
                    // Head
                    ctx.fillStyle = '#ffdbac';
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/4, w/3, 0, Math.PI * 2);
                    ctx.fill();
                    // Crown
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(x + w/4, y - 5, w/2, 8);
                    for(let i = 0; i < 4; i++) {
                        ctx.beginPath();
                        ctx.moveTo(x + w/4 + i * (w/2)/3, y - 5);
                        ctx.lineTo(x + w/4 + i * (w/2)/3 + (w/8)/2, y - 12);
                        ctx.lineTo(x + w/4 + (i + 1) * (w/2)/3, y - 5);
                        ctx.fill();
                    }
                    // Jewelry
                    ctx.fillStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.arc(x + w/2, y - 9, 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'penguin':
                    // Body
                    ctx.fillStyle = '#000';
                    ctx.fillRect(x, y, w, h);
                    // Belly
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(x + w/4, y + h/4, w/2, h/2);
                    // Beak
                    ctx.fillStyle = '#ff6600';
                    ctx.fillRect(x + w/2 - 3, y + h/3, 6, 4);
                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(x + w/3, y + h/4, 4, 0, Math.PI * 2);
                    ctx.arc(x + w*2/3, y + h/4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(x + w/3, y + h/4, 2, 0, Math.PI * 2);
                    ctx.arc(x + w*2/3, y + h/4, 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'rabbit':
                    // Body
                    ctx.fillStyle = '#d4a5a5';
                    ctx.fillRect(x, y + h/3, w, h*2/3);
                    // Head
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/4, w/3, 0, Math.PI * 2);
                    ctx.fill();
                    // Ears
                    ctx.fillRect(x + w/4, y - h/4, w/6, h/2);
                    ctx.fillRect(x + w*3/4 - w/6, y - h/4, w/6, h/2);
                    // Inner ears
                    ctx.fillStyle = '#ffb6c1';
                    ctx.fillRect(x + w/4 + 2, y - h/4 + 2, w/6 - 4, h/2 - 4);
                    ctx.fillRect(x + w*3/4 - w/6 + 2, y - h/4 + 2, w/6 - 4, h/2 - 4);
                    break;

                case 'flower':
                    // Stem
                    ctx.strokeStyle = '#228b22';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(x + w/2, y + h);
                    ctx.lineTo(x + w/2, y + h/2);
                    ctx.stroke();
                    // Petals
                    ctx.fillStyle = '#ff1493';
                    for(let i = 0; i < 6; i++) {
                        ctx.save();
                        ctx.translate(x + w/2, y + h/3);
                        ctx.rotate(i * Math.PI / 3);
                        ctx.beginPath();
                        ctx.ellipse(0, -10, 6, 10, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                    // Center
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(x + w/2, y + h/3, 6, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'cactus':
                    // Main body
                    ctx.fillStyle = '#3d9970';
                    ctx.fillRect(x + w/3, y, w/3, h);
                    // Arms
                    ctx.fillRect(x, y + h/3, w/3, h/4);
                    ctx.fillRect(x, y + h/3, w/6, h/3);
                    ctx.fillRect(x + w*2/3, y + h/2, w/3, h/4);
                    ctx.fillRect(x + w*5/6, y + h/2, w/6, h/3);
                    // Spines
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    for(let i = 0; i < 5; i++) {
                        for(let j = 0; j < 3; j++) {
                            ctx.beginPath();
                            ctx.moveTo(x + w/3 + j * w/6, y + i * h/5);
                            ctx.lineTo(x + w/3 + j * w/6 - 3, y + i * h/5 - 3);
                            ctx.stroke();
                        }
                    }
                    break;
            }

            ctx.restore();
        }

        function drawPlayer() {
            drawCharacter(player.x, player.y, player.width, player.height, selectedCharacter);
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(obs.x + 5, obs.y + 5, obs.width - 10, obs.height - 10);
            });
        }

        function drawCoins() {
            coins.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#f39c12';
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius - 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(coin.x - 2, coin.y - 4, 4, 3);
                }
            });
        }

        function drawGround() {
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(0, canvas.height - 70, canvas.width, 70);
            ctx.fillStyle = '#27ae60';
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.fillRect(i, canvas.height - 70, 20, 5);
            }
        }

        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            const cloudOffset = (frameCount * 0.2) % canvas.width;
            for (let i = -100; i < canvas.width + 100; i += 200) {
                const x = (i + cloudOffset) % (canvas.width + 200) - 100;
                ctx.beginPath();
                ctx.arc(x, 50, 20, 0, Math.PI * 2);
                ctx.arc(x + 20, 50, 25, 0, Math.PI * 2);
                ctx.arc(x + 40, 50, 20, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function updateLevel() {
            const newLevel = Math.floor(score / 100) + 1;
            if (newLevel > level) {
                level = newLevel;
                gameSpeed = 2 + (level - 1) * 0.5;
                document.getElementById('level').textContent = level;
            }
        }

        function gameOver() {
            gameRunning = false;
            gameOverScreen.classList.add('active');
            document.getElementById('finalScore').textContent = score;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }

            document.getElementById('finalHighScore').textContent = highScore;
        }

        function restartGame() {
            gameRunning = true;
            score = 0;
            level = 1;
            gameSpeed = 2;
            obstacles = [];
            coins = [];
            frameCount = 0;

            player.x = 50;
            player.y = 300;
            player.velocityY = 0;
            player.jumping = false;

            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('highScore').textContent = highScore;
            gameOverScreen.classList.remove('active');

            if (!characterSelectScreen.classList.contains('hidden')) {
                characterSelectScreen.classList.add('hidden');
            }

            gameLoop();
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawClouds();
            drawGround();

            updatePlayer();
            updateObstacles();
            updateCoins();
            updateLevel();

            drawPlayer();
            drawObstacles();
            drawCoins();

            frameCount++;
            if (frameCount % 120 === 0) {
                createObstacle();
            }
            if (frameCount % 80 === 0) {
                createCoin();
            }

            requestAnimationFrame(gameLoop);
        }

        // Initialize
        initCharacterSelect();
    </script>
</body>
</html>
